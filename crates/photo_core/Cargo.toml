[package]
name = "photo_core"
version = "0.1.0"
edition = "2021"
description = "Scans folders for photographs and arranges them by the date each was actually taken."
license = "MIT OR Apache-2.0"

[dependencies]
kamadak-exif = "0.5"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imagesize = "0.13"
serde = { version = "1", features = ["derive"] }

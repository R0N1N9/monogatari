[package]
name = "monogatari"
version = "0.1.0"
description = "A private desktop companion for re-knowing yourself through your own story."
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "monogatari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
photo_core = { path = "../crates/photo_core" }
vault_core = { path = "../crates/vault_core" }
keyring = "4"

# Tests the monogatari website on every push, and publishes it to GitHub Pages
# once Google sign-in is configured (the GOOGLE_CLIENT_ID repository variable).
# Setup steps: docs/WEBSITE.md
name: Website

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the website in a real browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Sign in, write, reconnect, go offline, merge — against a stand-in Google Drive
        run: npm run test:e2e:web

  publish:
    name: Publish to GitHub Pages
    needs: test
    # Only from the main branch, and only once Google sign-in has been set up.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.GOOGLE_CLIENT_ID != ''
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the website
        run: npm run build:web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_HOME_URL: ${{ vars.HOME_URL }}
          VITE_HOME_LABEL: ${{ vars.HOME_LABEL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
